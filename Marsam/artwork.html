<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>العمل الفني — مرسم</title>
</head>
<body>

  <nav class="nav-logo" style="border-bottom: 10px solid #c7b198;">
    <img src="pic/logo-Marsam.png" alt="Logo">
    <div class="links">
      <a href="Homepage.html">الرئيسية</a>
      <a href="Homepage.html#gallery">الأعمال الفنية</a>
      <a href="explore.html">الاستكشاف</a>
      <a href="about.html">نبذة عنّا</a>
    </div>
  </nav>

  <main class="aw-page">

    <!-- صورة العمل -->
    <div class="aw-visual">
      <img id="aw-image" src="" alt="">
    </div>

    <!-- لوحة المعلومات -->
    <aside class="aw-info">

      <a href="Homepage.html#gallery" class="aw-back-link">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 12l-4-4 4-4"/>
        </svg>
        العودة إلى المعرض
      </a>

      <!-- الأسلوب -->
      <span id="aw-badge" class="aw-style-badge">…</span>

      <!-- العنوان -->
      <h1 id="aw-title" class="aw-title">…</h1>

      <!-- الفنان -->
      <div class="aw-artist-row">
        <div class="aw-avatar" id="aw-initial">؟</div>
        <div>
          <div class="aw-artist-name" id="aw-artist">…</div>
          <div class="aw-artist-year" id="aw-year">…</div>
        </div>
      </div>

      <div class="aw-divider"></div>

      <!-- السعر -->
      <div class="aw-price-box">
        <span class="aw-price-label">السعر</span>
        <div class="aw-price-value" id="aw-price">…</div>
      </div>

      <!-- الوصف -->
      <p id="aw-desc" class="aw-desc">…</p>

      <!-- تفاصيل سريعة -->
      <div class="aw-meta-grid">
        <div class="aw-meta-item">
          <span class="aw-meta-label">السنة</span>
          <span class="aw-meta-val" id="aw-year-meta">…</span>
        </div>
        <div class="aw-meta-item">
          <span class="aw-meta-label">الأسلوب الفني</span>
          <span class="aw-meta-val" id="aw-style-meta">…</span>
        </div>
      </div>

      <div class="aw-divider"></div>

      <!-- حسابات التواصل -->
      <div class="aw-social-section">
        <p class="aw-social-title">تابع الفنان على</p>
        <div class="aw-social-links">

          <a id="link-instagram" href="#" target="_blank" class="aw-social-btn instagram">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            Instagram
          </a>

          <a id="link-facebook" href="#" target="_blank" class="aw-social-btn facebook">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Facebook
          </a>

          <a id="link-twitter" href="#" target="_blank" class="aw-social-btn twitter">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.736-8.84L1.254 2.25H8.08l4.26 5.632L18.243 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            Twitter
          </a>

        </div>
      </div>

    </aside>
  </main>

  <footer style="text-align:center; padding: 24px; border-top: 1px solid #ddd5c8; color:#8a9ba3; font-size:13px;">
    مرسم — المعرض الفني الرقمي &nbsp;·&nbsp; جميع الحقوق محفوظة ٢٠٢٦
  </footer>

  <script src="data.js"></script>
  <script src="artwork.js"></script>
</body>
</html>
